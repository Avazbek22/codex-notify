name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy codex_notify
      - run: python -m pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test deployment scripts
        run: |
          for script in install.sh scripts/*.sh tests/shell/*.sh; do bash -n "$script"; done
          for test_script in tests/shell/test-*.sh; do bash "$test_script"; done
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          tags: codex-notify:test

  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Advance deploy only to the newest successfully checked main SHA
        env:
          CANDIDATE: ${{ github.sha }}
        run: |
          git fetch origin main deploy 2>/dev/null || git fetch origin main
          test "$CANDIDATE" = "$(git rev-parse refs/remotes/origin/main)" || exit 0
          if git show-ref --verify --quiet refs/remotes/origin/deploy; then
            git merge-base --is-ancestor refs/remotes/origin/deploy "$CANDIDATE"
          fi
          git push origin "$CANDIDATE:refs/heads/deploy"
