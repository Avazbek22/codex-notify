name: ${COMPOSE_PROJECT_NAME:-codex-notify}

services:
  codex-notify:
    image: codex-notify:local
    build:
      context: .
      args:
        APP_COMMIT: ${APP_COMMIT:-local}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./codex-home:/app/codex-home
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
