[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-notify"
version = "0.1.0"
description = "Self-hosted single-owner Telegram monitor for Codex account limits"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Avazbek Olimov"}]
dependencies = [
  "aiogram==3.31.0",
  "pydantic==2.13.5",
  "tzdata==2026.3",
]

[project.scripts]
codex-notify = "codex_notify.main:run"

[tool.setuptools.packages.find]
include = ["codex_notify*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101", "E501", "RUF001", "S108", "ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "ASYNC240"]
"codex_notify/smoke.py" = ["S603", "S607"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["codex_notify"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiogram.*"]
ignore_missing_imports = true
